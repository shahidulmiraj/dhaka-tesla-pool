# Render Blueprint: the API as a free Docker web service (same image as compose).
# Secrets are entered in the Render dashboard (sync: false), never committed.
services:
  - type: web
    name: dhaka-tesla-pool-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    branch: pre-release # switch to release/v1.0.0 after the release cut
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL # Neon pooled connection string
        sync: false
      - key: DIRECT_URL # Neon direct (unpooled) connection string, used by migrate
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: CORS_ORIGIN # https://<project>.vercel.app
        sync: false
      - key: NODE_ENV
        value: production
